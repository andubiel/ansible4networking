---
# Point the containerlab Catalyst leafs at Splunk for syslog.
#
# Two addresses are involved and they are not interchangeable:
#   * splunk_mgmt_host  - how the execution environment reaches the Splunk REST
#                         API (the published management port on the AAP host).
#   * splunk_syslog_dst - where the switches send syslog. The leafs sit on the
#                         containerlab bridge, so they reach Splunk through the
#                         clab gateway, which Docker forwards into the container.
#
# The leaf management interface (GigabitEthernet0/0) lives in Mgmt-vrf, so the
# logging host statement must name the VRF or the switch routes the syslog out
# of the global table and it never arrives.
#
# The uri tasks deliberately do not set no_log. The module already marks its
# password parameter no_log, so the secret is masked even at -vvv, and a blanket
# no_log on the task only hides the API error when something fails.

- name: Configure Splunk to receive Cisco IOS syslog
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    splunk_mgmt_host: "{{ SPLUNK_HOST | default('172.16.0.5') }}"
    splunk_mgmt_port: "{{ SPLUNK_MGMT_PORT | default('18089') }}"
    splunk_user: "{{ SPLUNK_USERNAME | default('admin') }}"
    splunk_api: "https://{{ splunk_mgmt_host }}:{{ splunk_mgmt_port }}"
    syslog_port: "{{ splunk_syslog_port | default('1544') }}"
    syslog_index: "{{ splunk_syslog_index | default('cisco_ios') }}"
    syslog_sourcetype: "cisco:ios"

  tasks:
    - name: Check the Splunk password was supplied
      ansible.builtin.assert:
        that:
          - SPLUNK_PASSWORD is defined
          - SPLUNK_PASSWORD | length > 0
        fail_msg: >-
          No Splunk password supplied - attach the 'splunk' credential to the
          job template, or pass SPLUNK_PASSWORD as an extra var.

    - name: Create the index that holds the switch syslog
      ansible.builtin.uri:
        url: "{{ splunk_api }}/services/data/indexes"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          name: "{{ syslog_index }}"
          datatype: event
        status_code: [201, 409]   # 409 = already there
      register: splunk_index_result
      changed_when: splunk_index_result.status == 201

    # Unlike indexes and conf stanzas, a duplicate UDP input returns 400 rather
    # than 409, and 400 is too broad to accept blindly. Look first instead.
    - name: List the UDP inputs that already exist
      ansible.builtin.uri:
        url: "{{ splunk_api }}/services/data/inputs/udp?output_mode=json&count=0"
        method: GET
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: splunk_udp_inputs

    - name: Open the UDP syslog input
      when: syslog_port not in (splunk_udp_inputs.json.entry | default([]) | map(attribute='name') | list)
      ansible.builtin.uri:
        url: "{{ splunk_api }}/servicesNS/nobody/search/data/inputs/udp"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          name: "{{ syslog_port }}"
          index: "{{ syslog_index }}"
          sourcetype: "{{ syslog_sourcetype }}"
          # The host is taken from the IOS origin-id, not the sender IP - see
          # the transform below for why.
          connection_host: none
        status_code: [201]

    - name: Enforce the settings on the UDP input
      ansible.builtin.uri:
        url: "{{ splunk_api }}/servicesNS/nobody/search/data/inputs/udp/{{ syslog_port }}"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          index: "{{ syslog_index }}"
          sourcetype: "{{ syslog_sourcetype }}"
          connection_host: none
          disabled: "0"
        status_code: [200]
      changed_when: false
    # Docker's port publishing rewrites the source address of the inbound UDP
    # packet to the bridge gateway, so every switch would arrive as the same
    # host. The IOS origin-id carries the real device name, so pull the host out
    # of the message instead of trusting the sender IP.
    - name: Define the host extraction transform
      ansible.builtin.uri:
        url: "{{ splunk_api }}/servicesNS/nobody/search/configs/conf-transforms"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          name: cisco_ios_host_from_origin_id
          DEST_KEY: "MetaData:Host"
          REGEX: '^(?:\w{3}\s+\d+\s+[\d:]+\s+\S+\s+)?\d+:\s+([^:\s]+):'
          FORMAT: "host::$1"
        status_code: [201, 409]
      register: splunk_transform_result
      changed_when: splunk_transform_result.status == 201
    # Bound to the input's source rather than the sourcetype, because the Cisco
    # TA retypes some lines to cisco:ios:traceback and those need the host too.
    - name: Apply the transform to the syslog input
      ansible.builtin.uri:
        url: "{{ splunk_api }}/servicesNS/nobody/search/configs/conf-props"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          name: "source::udp:{{ syslog_port }}"
          TRANSFORMS-cisco_ios_host: cisco_ios_host_from_origin_id
        status_code: [201, 409]
      register: splunk_props_result
      changed_when: splunk_props_result.status == 201
    # Index-time settings only take effect after a restart, so only pay for one
    # when the parsing config actually changed.
    - name: Restart Splunk to load the index-time configuration
      when: splunk_transform_result.changed or splunk_props_result.changed
      block:
        - name: Request the restart
          ansible.builtin.uri:
            url: "{{ splunk_api }}/services/server/control/restart"
            method: POST
            user: "{{ splunk_user }}"
            password: "{{ SPLUNK_PASSWORD }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
        - name: Wait for Splunk to come back
          ansible.builtin.uri:
            url: "{{ splunk_api }}/services/server/info?output_mode=json"
            method: GET
            user: "{{ splunk_user }}"
            password: "{{ SPLUNK_PASSWORD }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
          register: splunk_back
          until: splunk_back.status == 200
          retries: 30
          delay: 10
    - name: Show the receiving configuration
      ansible.builtin.debug:
        msg:
          - "Splunk is listening for syslog on UDP {{ syslog_port }}"
          - "Events land in index '{{ syslog_index }}' as sourcetype '{{ syslog_sourcetype }}'"

- name: Point the Catalyst leafs at Splunk
  hosts: catalyst_switches
  gather_facts: false

  vars:
    syslog_port: "{{ splunk_syslog_port | default('1544') }}"
    # The clab gateway - the address the leafs use to reach the Splunk host.
    syslog_dst: "{{ splunk_syslog_dst | default('172.20.20.1') }}"
    # Management interface VRF. Set to '' on a device with mgmt in the global table.
    mgmt_vrf: "{{ switch_mgmt_vrf | default('Mgmt-vrf') }}"
    vrf_clause: "{{ ' vrf ' ~ mgmt_vrf if mgmt_vrf | length > 0 else '' }}"

  tasks:
    # 'logging trap informational' is deliberately not enforced here: it is the
    # IOS default, so it never appears in running-config and the task would
    # report changed on every run.
    - name: Configure syslog export to Splunk
      cisco.ios.config:
        lines:
          - "service timestamps log datetime msec localtime show-timezone"
          - "logging origin-id hostname"
          - "logging host {{ syslog_dst }}{{ vrf_clause }} transport udp port {{ syslog_port }}"
        # 'changed' not 'modified': the cat9kv carries self-signed certificate
        # material in running-config that never matches startup, so 'modified'
        # would save, and report changed, on every single run.
        save_when: changed
      register: syslog_config

    # Log every configuration command entered on the box. This emits
    # %PARSER-5-CFGLOG_LOGGEDCMD carrying the username and the exact command,
    # which is a lot more useful than the %SYS-5-CONFIG_I that IOS already sends
    # on leaving config mode - that one only says that something changed.
    #
    # 'notify syslog' is written back to running-config as 'notify syslog
    # contenttype plaintext', so the long form is what has to be enforced here
    # or the task never settles.
    - name: Log every CLI configuration change to syslog
      cisco.ios.config:
        parents:
          - archive
          - log config
        lines:
          - "logging enable"
          - "logging size 200"
          - "notify syslog contenttype plaintext"
        save_when: changed
      register: config_logger

    - name: Read back the config logger settings
      cisco.ios.command:
        commands: "show running-config all | section log config"
      register: config_logger_state

    # hidekeys keeps passwords out of the logged commands. It is the default on
    # this platform and so is not enforced above - it never appears in plain
    # running-config, which would make the task report changed forever. Verify
    # it instead: without it, any config line containing a credential would be
    # sent to Splunk in clear text.
    - name: Check passwords are masked in the logged commands
      ansible.builtin.assert:
        that:
          - "'hidekeys' in config_logger_state.stdout[0]"
          - "'no hidekeys' not in config_logger_state.stdout[0]"
        fail_msg: >-
          hidekeys is not active on {{ inventory_hostname }}, so configuration
          commands containing passwords would reach Splunk in clear text. Set
          'hidekeys' under archive / log config.
        success_msg: "Config change logging on, passwords masked by hidekeys"

    - name: Emit a test event so there is something to find
      cisco.ios.command:
        commands: 'send log 6 "SPLUNK-SETUP-VERIFY from {{ inventory_hostname }}"'

    - name: Show the logging state
      cisco.ios.command:
        commands: "show logging | include Trap logging|{{ syslog_dst }}"
      register: logging_state

    - name: Report what the switch is doing
      ansible.builtin.debug:
        msg: "{{ logging_state.stdout_lines[0] | select('search', syslog_dst) | list }}"

- name: Confirm Splunk is receiving from the leafs
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    splunk_mgmt_host: "{{ SPLUNK_HOST | default('172.16.0.5') }}"
    splunk_mgmt_port: "{{ SPLUNK_MGMT_PORT | default('18089') }}"
    splunk_user: "{{ SPLUNK_USERNAME | default('admin') }}"
    splunk_api: "https://{{ splunk_mgmt_host }}:{{ splunk_mgmt_port }}"
    syslog_index: "{{ splunk_syslog_index | default('cisco_ios') }}"
    expected_devices: "{{ groups['catalyst_switches'] | default([]) | length }}"

  tasks:
    # Syslog is fire and forget, so poll rather than assuming it has landed.
    - name: Wait for events from every switch
      ansible.builtin.uri:
        url: "{{ splunk_api }}/services/search/jobs"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          search: "search index={{ syslog_index }} earliest=-10m | stats count by host"
          exec_mode: oneshot
          output_mode: json
        return_content: true
        status_code: [200]
      register: splunk_search
      until: (splunk_search.json.results | default([]) | length | int) >= (expected_devices | int)
      retries: 18
      delay: 10

    - name: Report per device event counts
      ansible.builtin.debug:
        msg: "{{ item.host }}: {{ item.count }} events in the last 10 minutes"
      loop: "{{ splunk_search.json.results | default([]) }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Fail if any switch is missing
      ansible.builtin.assert:
        that:
          - (splunk_search.json.results | default([]) | length | int) >= (expected_devices | int)
        fail_msg: >-
          Only {{ splunk_search.json.results | default([]) | length }} of
          {{ expected_devices }} switches are reaching Splunk.
        success_msg: >-
          All {{ expected_devices }} switches are delivering syslog into
          index '{{ syslog_index }}'.

    # Reported, not asserted. On an idempotent re-run nothing on the switch
    # changes, so there is no new config-change event to find and an assert
    # here would fail for the wrong reason.
    - name: Count the CLI config changes Splunk has captured
      ansible.builtin.uri:
        url: "{{ splunk_api }}/services/search/jobs"
        method: POST
        user: "{{ splunk_user }}"
        password: "{{ SPLUNK_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          search: >-
            search index={{ syslog_index }} earliest=-24h CFGLOG_LOGGEDCMD
            | stats count by host
          exec_mode: oneshot
          output_mode: json
        return_content: true
        status_code: [200]
      register: cfglog_search

    - name: Report config changes seen per device
      ansible.builtin.debug:
        msg: "{{ item.host }}: {{ item.count }} CLI config changes logged in the last 24h"
      loop: "{{ cfglog_search.json.results | default([]) }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Note when no config change has been captured yet
      ansible.builtin.debug:
        msg: >-
          No %PARSER-5-CFGLOG_LOGGEDCMD events yet. Make a configuration change
          on a switch CLI and it will appear in index '{{ syslog_index }}'.
      when: (cfglog_search.json.results | default([]) | length) == 0

# Everything above gets the configuration-change syslog into Splunk. This play
# turns it into an event: a Splunk alert that posts the change to an AAP event
# stream, which a running rulebook activation picks up.
#
#   switch CLI -> syslog -> Splunk index -> saved search alert
#     -> Event-Driven Ansible Add-on for Splunk (webhook)
#     -> AAP event stream -> activation of extensions/eda/rulebooks/splunk_compliance.yml
#
# Three details of this chain are worth knowing before changing it:
#
#   * The shared secret is derived, not stored. The event stream authenticates
#     the add-on with HTTP Basic, and both ends need the same password on every
#     run or the playbook would have to rotate the secret each time to stay
#     idempotent. So unless EDA_EVENT_STREAM_PASSWORD is passed in, the password
#     is sha256(SPLUNK_PASSWORD:<event stream name>) - reproducible from one run
#     to the next, and derivable only by someone who already holds the Splunk
#     admin password. Change SPLUNK_PASSWORD and both sides must be recreated.
#
#   * The add-on resolves the event stream by hostname, because the AAP route is
#     selected by SNI - connecting to the ingress IP returns 503. The Splunk
#     container therefore carries an extra_hosts entry for the route; see
#     compose.yaml.
#
#   * The activation pins a hash of the rulebook in its source mappings, so AAP
#     can tell that the sources a user mapped are still the sources in the file.
#     Editing the rulebook invalidates it; the activation is
#     created with restart_on_project_update so AAP re-pins it on the next
#     project sync.
- name: Trigger Event-Driven Ansible on every configuration change
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    splunk_mgmt_host: "{{ SPLUNK_HOST | default('172.16.0.5') }}"
    splunk_mgmt_port: "{{ SPLUNK_MGMT_PORT | default('18089') }}"
    splunk_user: "{{ SPLUNK_USERNAME | default('admin') }}"
    splunk_api: "https://{{ splunk_mgmt_host }}:{{ splunk_mgmt_port }}"
    syslog_index: "{{ splunk_syslog_index | default('cisco_ios') }}"

    # CONTROLLER_* are the environment variables an AAP 'Red Hat Ansible
    # Automation Platform' credential injects, so attaching that credential to
    # the job template is enough. Outside AAP, pass AAP_HOST together with
    # either AAP_OAUTH_TOKEN or AAP_USERNAME/AAP_PASSWORD as extra vars.
    aap_host: "{{ AAP_HOST | default(lookup('ansible.builtin.env', 'CONTROLLER_HOST'), true) | regex_replace('/+$', '') }}"
    aap_user: "{{ AAP_USERNAME | default(lookup('ansible.builtin.env', 'CONTROLLER_USERNAME'), true) }}"
    aap_pass: "{{ AAP_PASSWORD | default(lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD'), true) }}"
    aap_token: "{{ AAP_OAUTH_TOKEN | default(lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN'), true) }}"
    eda_api: "{{ aap_host }}/api/eda/v1"

    eda_org: "{{ eda_organization | default('Network') }}"
    eda_project_name: "{{ eda_project | default('network-demos') }}"
    eda_project_url: "{{ eda_project_scm_url | default('http://172.16.0.5:3000/gitea/network-demos') }}"
    eda_rulebook_name: splunk_compliance.yml
    # Must match the name of the source in that rulebook - the activation maps
    # the event stream onto the source by name.
    eda_source_name: splunk_config_change
    eda_de_name: "{{ eda_decision_environment | default('Default decision environment') }}"
    eda_de_image: >-
      {{ eda_decision_environment_image
         | default('registry.redhat.io/ansible-automation-platform-27/de-supported-rhel9:latest') }}
    eda_credential_name: "{{ eda_event_stream_credential | default('Splunk event stream') }}"
    eda_stream_name: "{{ eda_event_stream | default('Splunk config change') }}"
    eda_stream_user: "{{ eda_event_stream_username | default('splunk') }}"
    eda_stream_password: >-
      {{ EDA_EVENT_STREAM_PASSWORD
         | default((SPLUNK_PASSWORD ~ ':' ~ eda_stream_name) | hash('sha256'), true) }}
    eda_activation_name: "{{ eda_rulebook_activation | default('Splunk compliance') }}"

    splunk_addon: ansible_addon_for_splunk
    splunk_addon_api: "{{ splunk_api }}/servicesNS/nobody/{{ splunk_addon }}/{{ splunk_addon }}_environment"
    splunk_addon_env: "{{ splunk_eda_environment | default('eda') }}"
    splunk_alert_name: "{{ splunk_eda_alert | default('Cisco IOS - CLI configuration change') }}"
    # The nobody namespace, not the admin user's. An object created there is
    # app-shared from the start, so it shows up in Search & Reporting for
    # everyone and, more importantly, updating it does not fork it: posting a
    # change to an app-shared object from inside a user namespace silently
    # clones it into that user's private namespace, and the two copies then
    # drift. Splunk still records the authenticated user as the owner, so the
    # scheduler has someone to dispatch the search as.
    splunk_alert_api: "{{ splunk_api }}/servicesNS/nobody/search/saved/searches"
    splunk_alert_search: >-
      index={{ syslog_index }} CFGLOG_LOGGEDCMD
      | rex field=_raw "User:(?<user>\S+)\s+logged command:(?<command>.+)"
      | table _time host user command _raw

  tasks:
    - name: Check the AAP connection details were supplied
      ansible.builtin.assert:
        that:
          - aap_host | length > 0
          - (aap_token | length > 0) or (aap_user | length > 0 and aap_pass | length > 0)
        fail_msg: >-
          No AAP connection details - attach a 'Red Hat Ansible Automation
          Platform' credential to the job template, or pass AAP_HOST plus
          AAP_OAUTH_TOKEN (or AAP_USERNAME/AAP_PASSWORD) as extra vars.

    # module_defaults rather than repeating the auth on a dozen uri tasks. A
    # token and a username/password are both accepted; the token wins when both
    # are present, and force_basic_auth goes off in that case so the module does
    # not put an empty Basic header over the top of the bearer one.
    - name: Build the Event-Driven Ansible side of the pipeline
      module_defaults:
        ansible.builtin.uri:
          user: "{{ aap_user }}"
          password: "{{ aap_pass }}"
          force_basic_auth: "{{ aap_token | length == 0 }}"
          headers: "{{ {'Authorization': 'Bearer ' ~ aap_token} if aap_token | length > 0 else {} }}"
          validate_certs: false
          body_format: json
      block:
        # The name filters below are server-side 'contains' matches, not exact
        # ones, so every lookup is narrowed again with selectattr. Without that,
        # an object named 'Splunk config change test' would be mistaken for
        # 'Splunk config change'.
        - name: Look up the organization that owns the automation
          ansible.builtin.uri:
            url: "{{ eda_api }}/organizations/?name={{ eda_org | urlencode }}"
            status_code: [200]
          register: eda_org_lookup

        - name: Resolve the organization id
          ansible.builtin.set_fact:
            eda_org_id: >-
              {{ eda_org_lookup.json.results | selectattr('name', 'equalto', eda_org)
                 | map(attribute='id') | first | default('') }}

        - name: Check the organization exists
          ansible.builtin.assert:
            that: eda_org_id | string | length > 0
            fail_msg: "No AAP organization named '{{ eda_org }}'."

        - name: Look for the decision environment
          ansible.builtin.uri:
            url: "{{ eda_api }}/decision-environments/?name={{ eda_de_name | urlencode }}"
            status_code: [200]
          register: eda_de_lookup

        - name: Create the decision environment
          when: >-
            eda_de_lookup.json.results | selectattr('name', 'equalto', eda_de_name)
            | list | length == 0
          ansible.builtin.uri:
            url: "{{ eda_api }}/decision-environments/"
            method: POST
            body:
              name: "{{ eda_de_name }}"
              description: Container image the rulebook activations run in
              image_url: "{{ eda_de_image }}"
              organization_id: "{{ eda_org_id | int }}"
            status_code: [201]
          register: eda_de_created
          changed_when: true

        - name: Resolve the decision environment id
          ansible.builtin.set_fact:
            eda_de_id: >-
              {{ eda_de_created.json.id | default(eda_de_lookup.json.results
                 | selectattr('name', 'equalto', eda_de_name) | map(attribute='id') | first, true) }}

        - name: Look up the Basic Event Stream credential type
          ansible.builtin.uri:
            url: "{{ eda_api }}/credential-types/?name={{ 'Basic Event Stream' | urlencode }}"
            status_code: [200]
          register: eda_cred_type_lookup

        - name: Resolve the credential type id
          ansible.builtin.set_fact:
            eda_cred_type_id: >-
              {{ eda_cred_type_lookup.json.results | selectattr('name', 'equalto', 'Basic Event Stream')
                 | map(attribute='id') | first | default('') }}

        - name: Look for the event stream credential
          ansible.builtin.uri:
            url: "{{ eda_api }}/eda-credentials/?name={{ eda_credential_name | urlencode }}"
            status_code: [200]
          register: eda_cred_lookup

        # no_log here, unlike everywhere else in this playbook: the shared
        # secret travels in the request body, and uri masks only its own
        # password parameter. Drop it temporarily if this task starts failing
        # and the API error is needed.
        - name: Create the event stream credential
          when: >-
            eda_cred_lookup.json.results | selectattr('name', 'equalto', eda_credential_name)
            | list | length == 0
          ansible.builtin.uri:
            url: "{{ eda_api }}/eda-credentials/"
            method: POST
            body:
              name: "{{ eda_credential_name }}"
              description: Basic auth shared with the Event-Driven Ansible Add-on for Splunk
              credential_type_id: "{{ eda_cred_type_id | int }}"
              organization_id: "{{ eda_org_id | int }}"
              inputs:
                auth_type: basic
                username: "{{ eda_stream_user }}"
                password: "{{ eda_stream_password }}"
                http_header_key: Authorization
            status_code: [201]
          register: eda_cred_created
          changed_when: true
          no_log: true

        - name: Resolve the event stream credential id
          ansible.builtin.set_fact:
            eda_cred_id: >-
              {{ eda_cred_created.json.id | default(eda_cred_lookup.json.results
                 | selectattr('name', 'equalto', eda_credential_name) | map(attribute='id') | first, true) }}

        - name: Look for the event stream
          ansible.builtin.uri:
            url: "{{ eda_api }}/event-streams/?name={{ eda_stream_name | urlencode }}"
            status_code: [200]
          register: eda_stream_lookup

        - name: Create the event stream
          when: >-
            eda_stream_lookup.json.results | selectattr('name', 'equalto', eda_stream_name)
            | list | length == 0
          ansible.builtin.uri:
            url: "{{ eda_api }}/event-streams/"
            method: POST
            body:
              name: "{{ eda_stream_name }}"
              eda_credential_id: "{{ eda_cred_id | int }}"
              organization_id: "{{ eda_org_id | int }}"
            status_code: [201]
          register: eda_stream_created
          changed_when: true

        # AAP builds this URL from EDA_EVENT_STREAM_BASE_URL, which is the
        # external route - the address Splunk has to post to.
        - name: Resolve the event stream id and URL
          ansible.builtin.set_fact:
            eda_stream_id: >-
              {{ eda_stream_created.json.id | default(eda_stream_lookup.json.results
                 | selectattr('name', 'equalto', eda_stream_name) | map(attribute='id') | first, true) }}
            eda_stream_url: >-
              {{ eda_stream_created.json.url | default(eda_stream_lookup.json.results
                 | selectattr('name', 'equalto', eda_stream_name) | map(attribute='url') | first, true) }}

        - name: Look for the Event-Driven Ansible project
          ansible.builtin.uri:
            url: "{{ eda_api }}/projects/?name={{ eda_project_name | urlencode }}"
            status_code: [200]
          register: eda_project_lookup

        - name: Create the Event-Driven Ansible project
          when: >-
            eda_project_lookup.json.results | selectattr('name', 'equalto', eda_project_name)
            | list | length == 0
          ansible.builtin.uri:
            url: "{{ eda_api }}/projects/"
            method: POST
            body:
              name: "{{ eda_project_name }}"
              url: "{{ eda_project_url }}"
              organization_id: "{{ eda_org_id | int }}"
            status_code: [201]
          register: eda_project_created
          changed_when: true

        - name: Resolve the project id
          ansible.builtin.set_fact:
            eda_project_id: >-
              {{ eda_project_created.json.id | default(eda_project_lookup.json.results
                 | selectattr('name', 'equalto', eda_project_name) | map(attribute='id') | first, true) }}

        # A project imports itself as soon as it is created, so wait for that to
        # land before deciding whether a sync is needed.
        - name: Wait for the project import to settle
          ansible.builtin.uri:
            url: "{{ eda_api }}/projects/{{ eda_project_id }}/"
            status_code: [200]
          register: eda_project_state
          until: eda_project_state.json.import_state not in ['pending', 'running']
          retries: 60
          delay: 5

        - name: Look for the rulebook in the project
          ansible.builtin.uri:
            url: "{{ eda_api }}/rulebooks/?project_id={{ eda_project_id }}&name={{ eda_rulebook_name | urlencode }}"
            status_code: [200]
          register: eda_rulebook_lookup

        # Only sync when the rulebook is missing. Syncing unconditionally would
        # make this play report changed on every single run.
        - name: Pull the rulebook in when the project has not imported it yet
          when: >-
            eda_rulebook_lookup.json.results | selectattr('name', 'equalto', eda_rulebook_name)
            | list | length == 0
          block:
            - name: Sync the project
              ansible.builtin.uri:
                url: "{{ eda_api }}/projects/{{ eda_project_id }}/sync/"
                method: POST
                status_code: [202]
              changed_when: true

            - name: Wait for the sync to finish
              ansible.builtin.uri:
                url: "{{ eda_api }}/projects/{{ eda_project_id }}/"
                status_code: [200]
              register: eda_project_synced
              until: eda_project_synced.json.import_state not in ['pending', 'running']
              retries: 60
              delay: 5

            - name: Look for the rulebook again
              ansible.builtin.uri:
                url: "{{ eda_api }}/rulebooks/?project_id={{ eda_project_id }}&name={{ eda_rulebook_name | urlencode }}"
                status_code: [200]
              register: eda_rulebook_resync

        # A skipped task still registers its result, so the two tasks inside the
        # block above cannot reuse the register names from outside it - they
        # would overwrite the earlier lookups with a 'skipped' dict whenever the
        # sync is not needed.
        - name: Resolve the rulebook
          ansible.builtin.set_fact:
            eda_rulebook: >-
              {{ (eda_rulebook_resync.json.results | default(eda_rulebook_lookup.json.results, true))
                 | selectattr('name', 'equalto', eda_rulebook_name) | list | first | default({}) }}

        - name: Check the project really carries the rulebook
          ansible.builtin.assert:
            that: eda_rulebook.rulesets is defined
            fail_msg: >-
              Project '{{ eda_project_name }}' does not contain
              {{ eda_rulebook_name }} at revision
              {{ eda_project_synced.json.git_hash | default(eda_project_state.json.git_hash, true) }}.
              AAP only scans 'extensions/eda/rulebooks' and then 'rulebooks',
              both relative to the repository root, so a rulebook anywhere else
              is silently dropped on sync. Commit and push it to one of those
              two paths, then run this again.

        - name: Look for the rulebook activation
          ansible.builtin.uri:
            url: "{{ eda_api }}/activations/?name={{ eda_activation_name | urlencode }}"
            status_code: [200]
          register: eda_activation_lookup

        # source_mappings is what turns the rulebook's placeholder webhook
        # source into the event stream. rulebook_hash is AAP's guard against the
        # file having changed since the mapping was made - it is a plain sha256
        # of the rulesets, and AAP rejects the activation if it does not match.
        - name: Create the rulebook activation
          when: >-
            eda_activation_lookup.json.results | selectattr('name', 'equalto', eda_activation_name)
            | list | length == 0
          ansible.builtin.uri:
            url: "{{ eda_api }}/activations/"
            method: POST
            body:
              name: "{{ eda_activation_name }}"
              description: Prints the Cisco IOS CLI configuration changes Splunk reports
              decision_environment_id: "{{ eda_de_id | int }}"
              rulebook_id: "{{ eda_rulebook.id | int }}"
              organization_id: "{{ eda_org_id | int }}"
              restart_policy: on-failure
              restart_on_project_update: true
              is_enabled: true
              log_level: info
              source_mappings: "{{ [{'event_stream_id': eda_stream_id | int,
                                     'event_stream_name': eda_stream_name,
                                     'source_name': eda_source_name,
                                     'rulebook_hash': eda_rulebook.rulesets | hash('sha256')}] | to_nice_yaml }}"
            status_code: [201]
          register: eda_activation_created
          changed_when: true

        - name: Resolve the activation id
          ansible.builtin.set_fact:
            eda_activation_id: >-
              {{ eda_activation_created.json.id | default(eda_activation_lookup.json.results
                 | selectattr('name', 'equalto', eda_activation_name) | map(attribute='id') | first, true) }}

        # First start pulls the decision environment image, which takes a while.
        - name: Wait for the activation to come up
          ansible.builtin.uri:
            url: "{{ eda_api }}/activations/{{ eda_activation_id }}/"
            status_code: [200]
          register: eda_activation_state
          until: eda_activation_state.json.status not in ['pending', 'starting']
          retries: 60
          delay: 5

        - name: Check the activation is listening
          ansible.builtin.assert:
            that: eda_activation_state.json.status == 'running'
            fail_msg: >-
              Activation '{{ eda_activation_name }}' is
              {{ eda_activation_state.json.status }}:
              {{ eda_activation_state.json.status_message | default('no detail') }}
            success_msg: "Activation '{{ eda_activation_name }}' is running"

    - name: Point Splunk at the event stream
      module_defaults:
        ansible.builtin.uri:
          user: "{{ splunk_user }}"
          password: "{{ SPLUNK_PASSWORD }}"
          force_basic_auth: true
          validate_certs: false
      block:
        - name: List the environments configured in the Event-Driven Ansible add-on
          ansible.builtin.uri:
            url: "{{ splunk_addon_api }}?output_mode=json&count=0"
            method: GET
            status_code: [200, 404]
          register: splunk_addon_envs

        - name: Check the add-on is installed
          ansible.builtin.assert:
            that: splunk_addon_envs.status == 200
            fail_msg: >-
              The Event-Driven Ansible Add-on for Splunk is not installed on
              {{ splunk_mgmt_host }}. Install it from Splunkbase (app id
              '{{ splunk_addon }}') and run this again.

        - name: Resolve the environment that already points at the event stream
          ansible.builtin.set_fact:
            splunk_addon_entry: >-
              {{ splunk_addon_envs.json.entry | default([])
                 | selectattr('name', 'equalto', splunk_addon_env) | list | first | default({}) }}

        # ssl_check_hostname is off because the AAP route is served with the
        # cluster's self-signed ingress certificate, which Splunk's CA bundle
        # has no reason to trust. Add that CA to the container and turn this on
        # if the add-on ever talks to a real AAP.
        - name: Register the event stream as an add-on environment
          when: splunk_addon_entry == {}
          ansible.builtin.uri:
            url: "{{ splunk_addon_api }}"
            method: POST
            body_format: form-urlencoded
            body:
              name: "{{ splunk_addon_env }}"
              environment: "{{ splunk_addon_env }}"
              integration_type: webhook
              webhook_endpoint: "{{ eda_stream_url }}"
              auth_type: basic
              basic_username: "{{ eda_stream_user }}"
              basic_password: "{{ eda_stream_password }}"
              ssl_check_hostname: "0"
              connection_timeout: "10"
              retries: "3"
            status_code: [200, 201]
          changed_when: true
          no_log: true

        # Recreating the event stream in AAP mints a new UUID, so the stored
        # endpoint can go stale while the rest of the configuration is fine.
        - name: Update the endpoint when the event stream has moved
          when:
            - splunk_addon_entry != {}
            - splunk_addon_entry.content.webhook_endpoint | default('') != eda_stream_url
          ansible.builtin.uri:
            url: "{{ splunk_addon_api }}/{{ splunk_addon_env }}"
            method: POST
            body_format: form-urlencoded
            body:
              webhook_endpoint: "{{ eda_stream_url }}"
            status_code: [200]
          changed_when: true

        # Look first, the same way the UDP input above is handled, so that a
        # conflict is never mistaken for success.
        - name: Look for the saved search
          ansible.builtin.uri:
            url: "{{ splunk_alert_api }}/{{ splunk_alert_name | urlencode }}?output_mode=json"
            method: GET
            status_code: [200, 404]
          register: splunk_alert_lookup

        - name: Create the saved search that fires on a configuration change
          when: splunk_alert_lookup.status == 404
          ansible.builtin.uri:
            url: "{{ splunk_alert_api }}"
            method: POST
            body_format: form-urlencoded
            body:
              name: "{{ splunk_alert_name }}"
              search: "{{ splunk_alert_search }}"
            status_code: [201]
          changed_when: true

        # Non-overlapping one-minute windows: the schedule runs every minute and
        # each run looks at the minute that has just closed, so no configuration
        # change is sent twice and none is skipped. realtime_schedule has to be
        # off for that - left on, Splunk runs the search as soon as it can and
        # drops windows when the scheduler is busy.
        #
        # digest mode sends one webhook per run carrying every change in the
        # window, rather than one webhook per change.
        - name: Enforce the alert settings and the Event-Driven Ansible action
          ansible.builtin.uri:
            url: "{{ splunk_alert_api }}/{{ splunk_alert_name | urlencode }}"
            method: POST
            body_format: form-urlencoded
            body:
              search: "{{ splunk_alert_search }}"
              description: >-
                Posts every %PARSER-5-CFGLOG_LOGGEDCMD logged by a Catalyst leaf
                to the '{{ eda_stream_name }}' AAP event stream.
              disabled: "0"
              is_scheduled: "1"
              cron_schedule: "* * * * *"
              realtime_schedule: "0"
              dispatch.earliest_time: "-1m@m"
              dispatch.latest_time: "@m"
              alert_type: "number of events"
              alert_comparator: "greater than"
              alert_threshold: "0"
              alert.digest_mode: "1"
              alert.track: "1"
              alert.suppress: "0"
              actions: ansible_core
              action.ansible_core: "1"
              action.ansible_core.param.alert_type: webhook
              action.ansible_core.param.environment: "{{ splunk_addon_env }}"
              action.ansible_core.param.send_all_results: plaintext
              action.ansible_core.param.results_per_batch: "100"
            status_code: [200]
          changed_when: false

    - name: Show what the chain now looks like
      ansible.builtin.debug:
        msg:
          - "Splunk alert '{{ splunk_alert_name }}' runs every minute over index '{{ syslog_index }}'"
          - "It posts to event stream '{{ eda_stream_name }}' at {{ eda_stream_url }}"
          - "Activation '{{ eda_activation_name }}' runs extensions/eda/rulebooks/{{ eda_rulebook_name }} and logs what arrives"
