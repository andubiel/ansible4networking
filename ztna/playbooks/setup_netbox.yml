---
- name: Setup Netbox
  hosts: localhost
  vars:
   state: present

  tasks:
    - name: "SETUP SITES"
      netbox.netbox.netbox_site:
        #netbox_url: "https://netbox-demo.netboxlabs.com/"
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data: "{{ item }}"
        state: "{{ state }}"
      loop: "{{ site_list }}"

    - name: "SETUP MANUFACTURERS"
      netbox.netbox.netbox_manufacturer:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: "{{ manufacturer }}"
        state: "{{ state }}"
      loop: "{{ manufacturers }}"
      loop_control:
        loop_var: manufacturer

    - name: "SETUP DEVICE ROLES"
      netbox.netbox.netbox_device_role:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: "{{ roles.name }}"
        state: "{{ state }}"
      loop: "{{ device_roles }}"
      loop_control:
        loop_var: roles

    - name: "SETUP DEVICE TYPES"
      netbox.netbox.netbox_device_type:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          model: "{{ device_type.model }}"
          manufacturer: "{{ device_type.manufacturer }}"
          slug: "{{ device_type.slug }}"
          part_number: "{{ device_type.part_number }}"
          is_full_depth: "{{ device_type.Full_depth }}"
        state: "{{ state }}"
      loop: "{{ device_types }}"
      loop_control:
        loop_var: device_type
        label: "{{ device_type['model'] }}"

    - name: "SETUP PLATFORMS"
      netbox.netbox.netbox_platform:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: "{{ platform.name }}"
          slug: "{{ platform.slug }}"
        state: "{{ state }}"
      loop: "{{ platforms }}"
      loop_control:
        loop_var: platform
        label: "{{ platform['name'] }}"

    - name: Create config template
      netbox.netbox.netbox_config_template:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
