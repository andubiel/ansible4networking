              !
              !
              !
              !
              !
              !
              !
              !
              !
              license udi pid C8000V sn 9CHM3KU4FX0
              memory free low-watermark processor 201711
              diagnostic bootup level minimal
              !
              !
              spanning-tree extend system-id
              !
              !
              username admin privilege 15 password 0 admin@123 ! lab-only password
              !
              redundancy
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              !
              interface Loopback0
               ip address 192.168.1.1 255.255.255.255
              !
              interface Tunnel0
               ip address 10.100.100.1 255.255.255.0
               ip mtu 1476
               ip tcp adjust-mss 1360
               ip ospf 1 area 0
               tunnel source GigabitEthernet3
               tunnel destination 172.16.61.128
              !
              interface Tunnel1
               ip address 10.200.200.1 255.255.255.0
               tunnel source GigabitEthernet2
               tunnel destination 172.16.62.128
              !
              interface GigabitEthernet1
               vrf forwarding clab-mgmt
               ip address 10.0.0.15 255.255.255.0
               negotiation auto
               no mop enabled
               no mop sysid
              !
              interface GigabitEthernet2
               ip address 172.16.62.129 255.255.255.0
               negotiation auto
               no mop enabled
               no mop sysid
              !
              interface GigabitEthernet3
               ip address 172.16.61.129 255.255.255.0
               negotiation auto
               no mop enabled
               no mop sysid
              !
              router ospf 1
               router-id 192.168.1.1
               redistribute bgp 65000
              !
              router bgp 65000
               bgp router-id 192.168.1.1
               bgp log-neighbor-changes
               neighbor 10.200.200.2 remote-as 65001
               neighbor 10.200.200.2 ebgp-multihop 255
              !
               address-family ipv4
                network 10.100.100.0 mask 255.255.255.0
                network 10.200.200.0 mask 255.255.255.0
                network 172.16.0.0
                network 192.168.1.1 mask 255.255.255.255
                redistribute ospf 1
                neighbor 10.200.200.2 activate
               exit-address-family
              !
              iox
              ip default-gateway 10.0.0.2
              ip forward-protocol nd
              ip tcp window-size 8192
              !
              no ip http server
              no ip http secure-server
              ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 10.0.0.2
              ip ssh maxstartups 128
              ip ssh bulk-mode 131072
              ip ssh server algorithm mac hmac-sha2-512
              ip scp server enable
              !
              !
              !
              !
              !
              !
              control-plane
              !
              !
              mgcp behavior rsip-range tgcp-only
              mgcp behavior comedia-role none
              mgcp behavior comedia-check-media-src disable
              mgcp behavior comedia-sdp-force disable
              !
              mgcp profile default
              !
              !
              !
              !
              !
              !
              line con 0
               stopbits 1
              line aux 0
              line vty 0 4
               login local
               transport input all
              !
              !
              netconf detailed-error
              netconf max-sessions 16
              !
              !
              !
              !
              !
              netconf-yang
              restconf
              end
        state: "{{ state }}"
    - name: Create a ansible_host on device 
      netbox.netbox.netbox_custom_field:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          object_types:
            - dcim.device
          name: ansible_host
          type: text
        state: "{{ state }}"

    - name: Create a ansible_port on device 
      netbox.netbox.netbox_custom_field:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          object_types:
            - dcim.device
          name: ansible_port
          type: text
        state: "{{ state }}"
   
   
    - name: Create Cisco router device within NetBox
      netbox.netbox.netbox_device:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: "{{ cisco_router_item.name }}"
          device_type: "{{ cisco_router_item.device_type }}"
          device_role: "{{ cisco_router_item.device_role }}"
          site: "{{ cisco_router_item.site }}"
          platform: "{{ cisco_router_item.platform }}"
          custom_fields: "{{ cisco_router_item.custom_fields }}"
        state: "{{ state }}"
      loop: "{{ cisco_routers }}"
      loop_control:
        loop_var: cisco_router_item

    - name: Create Cisco Switch devices within NetBox
      netbox.netbox.netbox_device:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: "{{ cisco_switch_item.name }}"
          device_type: "{{ cisco_switch_item.device_type }}"
          device_role: "{{ cisco_switch_item.device_role }}"
          site: "{{ cisco_switch_item.site }}"
          platform: "{{ cisco_switch_item.platform }}"
          custom_fields: "{{ cisco_switch_item.custom_fields }}"
        state: "{{ state }}"
      loop: "{{ cisco_switches }}"
      loop_control:
        loop_var: cisco_switch_item

    - name: Create Arista Router device within NetBox
      netbox.netbox.netbox_device:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: "{{ arista_router_item.name }}"
          device_type: "{{ arista_router_item.device_type }}"
          device_role: "{{ arista_router_item.device_role }}"
          site: "{{ arista_router_item.site }}"
          platform: "{{ arista_router_item.platform }}"
          custom_fields: "{{ arista_router_item.custom_fields }}"
        state: "{{ state }}"
      loop: "{{ arista_routers }}"
      loop_control:
        loop_var:  arista_router_item

    - name: Create config context
      netbox.netbox.netbox_config_context:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: NTP_IOS
          data:
            ntp_ios:
              servers:
              - server: 192.0.2.1
                version: 2
              - server: 192.0.2.2
                version: 2
          device_types: cat9kv
        state: "{{ state }}"

    - name: Create MAB ports config context
      netbox.netbox.netbox_config_context:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
          name: MAB_PORTS
          data:
            mab_ports:
              - name: "GigabitEthernet1/0/2"
                desc: "MAB-Endpoint-Host1"
                vlan: 999
                auth_status: "Unauthenticated"
              - name: "GigabitEthernet1/0/3"
                desc: "MAB-Endpoint-Host2"
                vlan: 999
                auth_status: "Unauthenticated"
          device_types: cat9kv
        state: "{{ state }}"

    - name: Create and Update Webhook
      netbox.netbox.netbox_webhook:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_api_key }}"
        data:
           name: "{{ webhook_item.name }}"
           payload_url: http://aap.example.org:5001
           body_template: !unsafe >-
            {{ data | tojson }}
      loop: "{{ webhooks }}"
      loop_control:
        loop_var:  webhook_item
        

             
