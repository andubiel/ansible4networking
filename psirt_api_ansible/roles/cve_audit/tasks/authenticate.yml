---
- name: Generate OAuth 2.0 Access Token
  ansible.builtin.uri:
    url: https://id.cisco.com/oauth2/default/v1/token
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ client_id }}"
      client_secret: "{{ client_secret }}"
    return_content: true
  register: token_response
  no_log: true
