---
- name: Get running configuration
  cisco.ios.ios_command:
    commands: show running-config
  register: running_config

- name: Get IOS-XE version
  cisco.ios.ios_command:
    commands: show version
  register: show_version

- name: Extract IOS-XE version number
  ansible.builtin.set_fact:
    ios_version: "{{ show_version.stdout[0] | regex_search('Version ([\\d.]+[a-zA-Z]*)', '\\1') | first }}"

- name: Display detected version
  ansible.builtin.debug:
    msg: "Detected IOS-XE version: {{ ios_version }} on {{ inventory_hostname }}"
