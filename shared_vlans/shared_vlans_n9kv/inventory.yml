---
# Example inventory for the n9kv variant. The containerlab host is remote from AAP,
# so SSH goes to the containerlab host and lands on each n9kv through its port
# mapping (2232 -> n9kv1:22, 2233 -> n9kv2:22). Ports differ from the cat9kv lab
# (2230/2231) so both labs can run on the same containerlab host.
# In AAP these hosts live in "Workshop Inventory" (see setup.yml).
shared_vlan_n9kv:
  hosts:
    n9kv1:
      ansible_host: "{{ container_lab }}"
      ansible_port: 2232
    n9kv2:
      ansible_host: "{{ container_lab }}"
      ansible_port: 2233
  vars:
    container_lab: 10.10.10.10   # containerlab host (same var as Workshop Inventory)
    # No password here: AAP jobs use the "Shared VLAN n9kv Credential" Machine credential (setup.yml).
    # For local runs, pass -k to be prompted, or store ansible_password in Ansible Vault.
    ansible_user: admin
