name: shared_vlan_n9kv
# Shared VLAN lab, Nexus 9000v (NX-OS) variant: Private VLANs + VRF-Lite + 802.1Q trunk
#
#   research-srv (10.30.30.10)                         guest1 (10.200.200.20, VLAN 200)
#        | eth1                                              | eth1
#   [n9kv1 Eth1/2] VRF RESEARCH               [n9kv2 Eth1/6] access VLAN 200
#   n9kv1 (core / promiscuous gateway)        n9kv2 (access / PVLAN host ports)
#   Eth1/1 ======== 802.1Q trunk 100,101,102,200 ======== Eth1/1
#                                             Eth1/2 host1  isolated  VLAN 101 (10.100.100.11)
#                                             Eth1/3 host2  isolated  VLAN 101 (10.100.100.12)
#                                             Eth1/4 host3  community VLAN 102 (10.100.100.13)
#                                             Eth1/5 host4  community VLAN 102 (10.100.100.14)
#
# Containerlab ethN on an n9kv maps to Ethernet1/N. Links are kept contiguous per node.
# Lab name, SSH ports (2232/2233) and mgmt IPs (172.20.20.81-88) differ from the cat9kv
# lab (shared_vlan, 2230/2231, .71-.78) so both can run on the same containerlab host.
# WARNING: LAB-ONLY default password (admin@123). Not for production. Change it here and in the
# switch startup configs, or keep real credentials only in AAP / Ansible Vault, never in git.
# startup-config files live on the containerlab host and must create the AAP login:
#   username admin password admin@123 role network-admin
#
# NOTE: n9kv's emulated data plane does not forward private-VLAN traffic, so
# shared_vlan_n9kv_validate fails "isolated -> gateway" and the workflow restores.
# See README.md.
topology:
  kinds:
    cisco_n9kv:
      # Use the n9kv image available on the containerlab host
      image: vrnetlab/cisco_n9kv:10.5.3
    linux:
      image: debian:latest

  nodes:
    n9kv1:
      kind: cisco_n9kv
      startup-config: configs/n9kv1/startup.cfg
      mgmt-ipv4: 172.20.20.81
      ports:
        - "2232:22"

    n9kv2:
      kind: cisco_n9kv
      startup-config: configs/n9kv2/startup.cfg
      mgmt-ipv4: 172.20.20.82
      ports:
        - "2233:22"

    # Research server behind the gateway (VRF RESEARCH)
    research-srv:
      kind: linux
      mgmt-ipv4: 172.20.20.83
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.30.30.10/24 dev eth1
        - ip link set dev eth1 up
        - ip route add 10.100.100.0/24 via 10.30.30.1

    # Isolated endpoint 1 (e.g. OT sensor)
    host1:
      kind: linux
      mgmt-ipv4: 172.20.20.84
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.100.100.11/24 dev eth1
        - ip link set dev eth1 up
        - ip route add 10.30.30.0/24 via 10.100.100.1
        - ip route add 10.200.200.0/24 via 10.100.100.1

    # Isolated endpoint 2 (e.g. OT sensor)
    host2:
      kind: linux
      mgmt-ipv4: 172.20.20.85
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.100.100.12/24 dev eth1
        - ip link set dev eth1 up
        - ip route add 10.30.30.0/24 via 10.100.100.1
        - ip route add 10.200.200.0/24 via 10.100.100.1

    # Community endpoint 1 (e.g. lab workstation)
    host3:
      kind: linux
      mgmt-ipv4: 172.20.20.86
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.100.100.13/24 dev eth1
        - ip link set dev eth1 up
        - ip route add 10.30.30.0/24 via 10.100.100.1
        - ip route add 10.200.200.0/24 via 10.100.100.1

    # Community endpoint 2 (e.g. lab workstation)
    host4:
      kind: linux
      mgmt-ipv4: 172.20.20.87
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.100.100.14/24 dev eth1
        - ip link set dev eth1 up
        - ip route add 10.30.30.0/24 via 10.100.100.1
        - ip route add 10.200.200.0/24 via 10.100.100.1

    # Guest / vendor endpoint (VRF GUEST)
    guest1:
      kind: linux
      mgmt-ipv4: 172.20.20.88
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.200.200.20/24 dev eth1
        - ip link set dev eth1 up
        - ip route add 10.30.30.0/24 via 10.200.200.1
        - ip route add 10.100.100.0/24 via 10.200.200.1

  links:
    # 802.1Q trunk between core and access
    - endpoints: ["n9kv1:eth1", "n9kv2:eth1"]
    # Routed port to research server (VRF RESEARCH)
    - endpoints: ["n9kv1:eth2", "research-srv:eth1"]
    # PVLAN isolated host ports
    - endpoints: ["n9kv2:eth2", "host1:eth1"]
    - endpoints: ["n9kv2:eth3", "host2:eth1"]
    # PVLAN community host ports
    - endpoints: ["n9kv2:eth4", "host3:eth1"]
    - endpoints: ["n9kv2:eth5", "host4:eth1"]
    # Guest access port
    - endpoints: ["n9kv2:eth6", "guest1:eth1"]
