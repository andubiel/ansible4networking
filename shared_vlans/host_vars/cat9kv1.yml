---
# Core / promiscuous gateway switch
hostname: cat9kv1

base_interfaces:
  - name: GigabitEthernet1/0/1
    description: TRUNK to cat9kv2 Gi1/0/1
    mode: layer2
    enabled: true
  - name: GigabitEthernet1/0/2
    description: research-srv (VRF RESEARCH)
    mode: layer3
    enabled: true

trunk_ports:
  - name: GigabitEthernet1/0/1
    allowed_vlans: "100-102,200"

access_ports: []
pvlan_host_ports: []

vrfs:
  - name: RESEARCH
    description: Secure research / OT environment
  - name: GUEST
    description: Guest and vendor access

# Order matters: SVIs/routed ports get "vrf forwarding" before the IP
vrf_interfaces:
  - name: Vlan100
    description: PVLAN primary gateway (shared subnet)
    vrf: RESEARCH
    ipv4: 10.100.100.1
    mask: 255.255.255.0
  - name: Vlan200
    description: Guest gateway
    vrf: GUEST
    ipv4: 10.200.200.1
    mask: 255.255.255.0
  - name: GigabitEthernet1/0/2
    description: research-srv (VRF RESEARCH)
    vrf: RESEARCH
    ipv4: 10.30.30.1
    mask: 255.255.255.0

# Promiscuous L3 gateway: maps the secondary VLANs onto the primary SVI
pvlan_svi_mappings:
  - name: Vlan100
    mapping: "101,102"
