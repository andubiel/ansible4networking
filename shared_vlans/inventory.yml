---
# Example inventory. The containerlab host is remote from AAP, so SSH goes to the
# containerlab host and lands on each cat9kv through its port mapping
# (2230 -> cat9kv1:22, 2231 -> cat9kv2:22).
# In AAP these hosts live in "Workshop Inventory" (see setup.yml).
shared_vlan:
  hosts:
    cat9kv1:
      ansible_host: "{{ container_lab }}"
      ansible_port: 2230
    cat9kv2:
      ansible_host: "{{ container_lab }}"
      ansible_port: 2231
  vars:
    container_lab: 10.10.10.10   # containerlab host (same var as Workshop Inventory)
    # No password here: AAP jobs use the "Shared VLAN cat9kv Credential" Machine credential (setup.yml).
    # For local runs, pass -k to be prompted, or store ansible_password in Ansible Vault.
    ansible_user: admin
