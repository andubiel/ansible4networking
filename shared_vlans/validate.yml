---
# Workflow node after Shared-VLAN-Scoped-Config.
# Runs on the containerlab host (inventory "containerlab", host containerlab1)
# and pings between endpoint containers to prove PVLAN + VRF-Lite isolation.
# Publishes "validation_report" to the workflow and FAILS if any check fails,
# which sends the workflow down the shared_vlan_restore path.
- name: Shared VLAN lab - validate segmentation
  hosts: "{{ validate_host | default('containerlab1') }}"
  gather_facts: false

  roles:
    - role: shared_vlan_validate
